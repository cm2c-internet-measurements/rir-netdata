[project]
name = "rir-netdata"
version = "2.1.0"
description = "Builds a daily SQLite snapshot of RIR delegations, RPKI ROAs and RIS whois data."
readme = "README.md"
license = "BSD-2-Clause"
authors = [{ name = "Carlos M. Martinez", email = "carlos@lacnic.net" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0",
    "httpx>=0.27",
    "petl>=1.7",
    "rich>=13.7",
    "tenacity>=8.2",
    "typer>=0.12",
]

[project.scripts]
rir-netdata = "rir_netdata.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live servers; deselected by default"]
addopts = "-m 'not network'"
